<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Aptitude Image Vault & Direct PDF Converter</title>
  <meta name="description" content="Store, organize, and directly convert and merge images into high-resolution multi-page PDF documents with an administrative upload portal.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Application Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- jsPDF, Canvas Confetti & GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <!-- Top Left Corner: Logo Dot & "Aptitude PDFs" Name -->
  <div class="corner-brand-wrapper">
    <a href="#" class="corner-brand-logo" title="Aptitude PDFs">
      <span class="corner-logo-dot"></span>
      <span class="corner-brand-text">Aptitude PDFs</span>
    </a>
  </div>

  <!-- Top Right Corner: View Pattern & Theme Switcher -->
  <div class="corner-actions-wrapper">
    <button class="corner-theme-btn" id="viewModeToggleBtn" title="Switch to List Pattern" aria-label="Toggle View Mode">
      <i class="fa-solid fa-list-ul" id="viewModeIcon"></i>
    </button>
    <button class="corner-theme-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
      <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
    </button>
  </div>

  <!-- Full Page Interactive Kinetic Grid Background Canvas -->
  <div class="global-canvas-background">
    <canvas id="globalKineticGridCanvas"></canvas>
  </div>

  <!-- Category & Albums 3D Fan Carousel Section -->
  <section class="category-section" id="albumsSection">
    <div class="container">
      <!-- Floating Border Beam Search Bar on Background -->
      <div class="page-search-container">
        <div class="border-beam-search-wrapper">
          <div class="border-beam-border"></div>
          <div class="border-beam-search-inner">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="mainSearchInput" placeholder="Search formulas, reasoning & collections...">
          </div>
        </div>

        <!-- Segmented View Mode Switcher Capsule -->
        <div class="view-pattern-pill" id="viewPatternPill">
          <button class="pattern-switch-btn active" id="viewCardBtn" data-mode="card" title="3D Card Fan">
            <i class="fa-solid fa-layer-group"></i>
            <span>Cards</span>
          </button>
          <button class="pattern-switch-btn" id="viewListBtn" data-mode="list" title="List Pattern">
            <i class="fa-solid fa-list-ul"></i>
            <span>List</span>
          </button>
        </div>
      </div>

      <!-- 3D Fan Layout Wrapper -->
      <div class="fan-carousel-stage" id="fanCarouselStage">
        <div class="fan-layout" id="fanLayoutContainer">
          <!-- Rendered dynamically as 3D fan cards -->
        </div>
      </div>

      <!-- Carousel Pagination Controls with Glassmorphic Capsule -->
      <div class="fan-controls-capsule" id="fanControlsCapsule">
        <button class="fan-arrow-btn" id="fanPrevBtn" aria-label="Previous Option">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="fan-dots" id="fanDotsContainer">
          <!-- Dots rendered dynamically -->
        </div>
        <button class="fan-arrow-btn" id="fanNextBtn" aria-label="Next Option">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- List Pattern View (Grid / Rows of All Collections) -->
      <div class="collections-list-view" id="collectionsListView" style="display: none;">
        <div class="list-pattern-header">
          <div class="list-pattern-stats">
            <span class="list-pattern-badge"><i class="fa-solid fa-layer-group"></i> All Collections</span>
            <span class="list-pattern-count" id="listTotalCountDisplay">9 Topics Available</span>
          </div>
          <div class="list-pattern-quick-actions">
            <span class="list-sort-label">Sort:</span>
            <select id="listSortSelect" class="list-sort-dropdown" aria-label="Sort Collections">
              <option value="default">Default Order</option>
              <option value="name-asc">Name (A - Z)</option>
              <option value="name-desc">Name (Z - A)</option>
              <option value="photos-desc">Most Photos</option>
            </select>
          </div>
        </div>

        <div class="collections-list-grid" id="collectionsListGrid">
          <!-- Rendered dynamically as responsive list items -->
        </div>

        <div class="list-empty-state" id="listEmptyState" style="display: none;">
          <i class="fa-solid fa-magnifying-glass"></i>
          <h4>No collections found</h4>
          <p>Try searching with another keyword.</p>
        </div>
      </div>
    </div>
  </section>



  <!-- Full Screen PDF Document Viewer Modal (Matching Reference UI) -->
  <div class="modal-overlay pdf-viewer-fullscreen-overlay" id="pdfViewerModal">
    <div class="pdf-app-window">
      
      <!-- Primary Top Navigation Bar (Dark) -->
      <div class="pdf-top-navbar">
        <div class="pdf-navbar-left">
          <div class="pdf-file-icon"><i class="fa-solid fa-file-pdf"></i></div>
          <h2 class="pdf-doc-filename" id="pdfDocumentName">Document.pdf</h2>
        </div>
        
        <div class="pdf-navbar-right">
          <button type="button" class="pdf-nav-btn btn-fullscreen" id="pdfToggleFullscreenBtn" onclick="window.app && window.app.toggleDeviceFullscreen()" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
          <button type="button" class="pdf-nav-btn btn-free-download" id="pdfDownloadBtn" title="Free Download">
            <i class="fa-solid fa-download"></i>
          </button>
          <button type="button" class="pdf-nav-btn btn-close-red" onclick="window.app.closeModal('pdfViewerModal')" title="Close Reader / Back">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Secondary PDF Control Toolbar -->
      <div class="pdf-sub-toolbar">
        <!-- Left: Menu & pdf tag -->
        <div class="pdf-toolbar-group pdf-toolbar-left">
          <button class="pdf-tool-icon-btn" id="pdfSidebarToggleBtn" title="Toggle Thumbnails">
            <i class="fa-solid fa-bars"></i>
          </button>
          <span class="pdf-toolbar-label">pdf</span>
        </div>

        <!-- Center: Page navigation, Zoom, View modes -->
        <div class="pdf-toolbar-group pdf-toolbar-center">
          <!-- Page Number Box -->
          <div class="pdf-page-selector">
            <input type="number" id="pdfCurrentPageInput" value="1" min="1" max="1" aria-label="Current Page">
            <span class="pdf-page-slash">/</span>
            <span class="pdf-page-total" id="pdfTotalPagesDisplay">1</span>
          </div>

          <span class="pdf-toolbar-divider"></span>

          <!-- Zoom Controls -->
          <div class="pdf-zoom-controls">
            <button class="pdf-tool-icon-btn" id="pdfZoomOutBtn" title="Zoom Out">
              <i class="fa-solid fa-minus"></i>
            </button>
            <span class="pdf-zoom-level" id="pdfZoomLevelDisplay">100%</span>
            <button class="pdf-tool-icon-btn" id="pdfZoomInBtn" title="Zoom In">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>

          <span class="pdf-toolbar-divider"></span>

          <!-- Page Layout / Fit Options -->
          <button class="pdf-tool-icon-btn" id="pdfFitWidthBtn" title="Fit to Width / Page">
            <i class="fa-regular fa-file"></i>
          </button>
          <button class="pdf-tool-icon-btn" id="pdfRotateBtn" title="Rotate Clockwise (90°)">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <button class="pdf-tool-icon-btn" id="pdfAnnotateBtn" title="Draw & Markup Notes">
            <i class="fa-solid fa-pen-nib"></i>
          </button>
          <button class="pdf-tool-icon-btn" id="pdfUndoBtn" title="Undo Action">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
          <button class="pdf-tool-icon-btn" id="pdfRedoBtn" title="Redo Action">
            <i class="fa-solid fa-arrow-rotate-right"></i>
          </button>
        </div>
      </div>

      <!-- Main PDF Document Viewport Area -->
      <div class="pdf-reader-fullscreen-viewport" id="pdfDocumentStreamContainer">
        <div class="pdf-document-stream" id="pdfDocumentStream">
          <!-- All photos rendered dynamically as real PDF pages -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/pdfEngine.js"></script>
  <script src="js/kineticGrid.js"></script>
  <script src="js/cardFanCarousel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
